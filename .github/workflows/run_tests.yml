name: Run Integration tests via Pytest

on:
  push:
    branches:
      - main
      - levje/dpo
  pull_request:
    branches:
      - main
      - levje/dpo
jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3
      - name: Set up Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"
      - name: Install dependencies
        env:
          SETUPTOOLS_USE_DISTUTILS: "stdlib"
        run: |
          bash install.sh
      - name: Run tests
        run: python -m pytest .
