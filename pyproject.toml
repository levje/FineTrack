[build-system]
requires = ["setuptools >= 61.0", "torch==2.2.0"]
build-backend = "setuptools.build_meta"

[project]
name = "FineTrack"
version = "0.1.0"
authors = [
    { name="Jeremi Levesque", email="jeremi.levesque@usherbrooke.ca" }
]
description = "RL-based tractography with policy-aligned reward model"
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    'Programming Language :: Python :: 3',
    'Development Status :: 3 - Alpha',
    'Intended Audience :: Science/Research',
    'Topic :: Scientific/Engineering :: Artificial Intelligence',
]
keywords = ["reinforcement-learning", "tractography", "diffusion-MRI"]
dependencies = [
    "dwi-ml",
    "nextflowpy>=0.11.0",
    "pytest>=7.2.2",
    "seaborn>=0.13.2",
    "torchmetrics>=1.7.1",
]

[project.urls]
Repository = "https://github.com/levje/FineTrack"

[tool.uv.sources]
dwi-ml = { git = "https://github.com/levje/dwi_ml", rev = "levje/update_spams" }

